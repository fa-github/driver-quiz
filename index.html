<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本免学科試験クイズアプリ</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary-color: #007aff;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        #app {
            background-color: var(--card-bg);
            width: 92%; max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column;
            min-height: 85vh;
        }

        .screen { display: none; flex-direction: column; height: 100%; flex-grow: 1; }
        .active { display: flex; }

        h1 { font-size: 1.4em; text-align: center; color: var(--text-main); margin-top: 10px; }
        h2 { font-size: 1.0em; color: var(--text-sub); text-align: center; margin-bottom: 20px; }

        label { font-weight: bold; margin-top: 15px; display: block; color: var(--text-main); }
        select {
            width: 100%; padding: 14px; font-size: 1.1em;
            border-radius: 12px; border: 1px solid #d1d1d6;
            background-color: #f9f9f9; margin-top: 8px; box-sizing: border-box;
        }

        .radio-group { display: flex; gap: 10px; margin-top: 8px; }
        .radio-btn {
            flex: 1; padding: 14px; text-align: center;
            border: 1px solid #d1d1d6; border-radius: 12px;
            cursor: pointer; font-weight: bold; background-color: #f9f9f9;
        }
        .radio-btn.selected {
            background-color: var(--primary-color); color: white; border-color: var(--primary-color);
        }

        .btn-start, #next-btn, .btn-secondary {
            background-color: var(--primary-color); color: white; border: none;
            padding: 16px; font-size: 1.1em; font-weight: bold;
            border-radius: 14px; cursor: pointer; margin-top: 10px; width: 100%;
        }

        .btn-secondary {
            background-color: #8e8e93;
        }

        .quiz-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e5e5ea; padding-bottom: 10px; margin-bottom: 15px;
            font-size: 0.9em; color: var(--text-sub);
        }
        .score-badge {
            background-color: #e5f1ff; color: var(--primary-color);
            padding: 4px 10px; border-radius: 10px; font-weight: bold;
        }

        .img-container { width: 100%; text-align: center; margin-bottom: 15px; display: none; }
        .img-container img { max-width: 100%; max-height: 180px; border-radius: 10px; border: 1px solid #e5e5ea; }

        #question-text {
            font-size: 1.2em; line-height: 1.6; color: var(--text-main);
            margin-bottom: 25px; flex-grow: 1; font-weight: 500;
        }

        .btn-ans-group { display: flex; gap: 15px; margin-bottom: 10px; }
        .btn-ans {
            flex: 1; padding: 18px 0; font-size: 2.8em;
            border: none; border-radius: 16px; cursor: pointer; color: white; font-weight: bold;
        }
        #btn-true { background-color: var(--success-color); }
        #btn-false { background-color: var(--danger-color); }

        #result-box { display: none; text-align: center; border-top: 1px solid #e5e5ea; padding-top: 15px; }
        #judgment { font-size: 2.0em; font-weight: bold; margin-bottom: 8px; }
        .correct-judg { color: var(--success-color); }
        .incorrect-judg { color: var(--danger-color); }
        #explanation {
            font-size: 0.95em; line-height: 1.5; color: var(--text-main);
            background-color: #f2f2f7; padding: 14px; border-radius: 12px;
            margin: 10px 0 15px 0; text-align: left;
        }

        .top-nav {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;
        }
        .btn-quit {
            background: none; border: none; color: #ff3b30; font-size: 0.9em; font-weight: bold; cursor: pointer; padding: 0;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 1. 設定・セット選択画面 -->
    <div id="setup-screen" class="screen active">
        <h1>本免学科試験クイズ</h1>
        <h2>条件を選んでスタート</h2>

        <div id="resume-box" style="display:none; background:#e5f1ff; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center;">
            <p style="margin:0 0 10px 0; font-weight:bold; color:#007aff;">前回の続きがあります</p>
            <button class="btn-start" style="margin:0;" onclick="resumeQuiz()">中断したところから再開</button>
        </div>

        <label>1. 問題セットを選択</label>
        <select id="set-select">
            <option value="1">第 1 集（全105問）</option>
            <option value="2">第 2 集（全105問）</option>
            <option value="3">第 3 集（全105問）</option>
            <option value="4">第 4 集（準備中）</option>
            <option value="5">第 5 集（準備中）</option>
            <option value="6">第 6 集（準備中）</option>
            <option value="7">第 7 集（準備中）</option>
        </select>

        <label>2. 出題順</label>
        <div class="radio-group">
            <div class="radio-btn selected" onclick="selectOrder('normal', this)">順番通り</div>
            <div class="radio-btn" onclick="selectOrder('random', this)">ランダム</div>
        </div>

        <button class="btn-start" onclick="startNewQuiz()">新しく学習を開始する</button>
    </div>

    <!-- 2. クイズプレイ画面 -->
    <div id="quiz-screen" class="screen">
        <div class="top-nav">
            <button class="btn-quit" onclick="quitQuiz()">✕ 中断して戻る</button>
            <div class="score-badge">獲得点: <span id="current-score">0</span> / 100 点</div>
        </div>

        <div class="quiz-header">
            <div>進捗: <span id="q-idx">1</span> / <span id="q-total">105</span> 問目</div>
            <div>ミス: <span id="mistake-count" style="color:var(--danger-color); font-weight:bold;">0</span> 問</div>
        </div>

        <div id="img-box" class="img-container">
            <img id="q-img" src="" alt="問題画像">
        </div>

        <div id="question-text">読み込み中...</div>

        <div id="answer-buttons" class="btn-ans-group">
            <button id="btn-true" class="btn-ans" onclick="checkAnswer('◯')">◯</button>
            <button id="btn-false" class="btn-ans" onclick="checkAnswer('✕')">✕</button>
        </div>

        <div id="result-box">
            <div id="judgment"></div>
            <div style="font-size:1.1em; margin-bottom:5px;">解答: <span id="correct-ans" style="font-weight:bold;"></span></div>
            <div id="explanation"></div>
            <button id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="screen" style="text-align: center; justify-content: center;">
        <h1 id="final-status">結果発表</h1>
        <div style="font-size: 3em; font-weight: bold; margin: 15px 0 5px 0;" id="final-score">0 点</div>
        <p style="color:var(--text-sub); margin-bottom:20px;">（100点満点中）</p>

        <div style="background:#f2f2f7; padding:15px; border-radius:12px; margin-bottom:20px; text-align:left; line-height:1.8;">
            <div>・間違えた問題数: <strong id="final-mistakes" style="color:var(--danger-color);">0</strong> 問</div>
            <div>・結果: <strong id="pass-fail-text"></strong></div>
        </div>

        <button class="btn-start" onclick="location.reload()">トップに戻る</button>
    </div>
</div>

<script>
    // ★ あなたのGoogle Apps ScriptのWebアプリURL ★
    const GAS_API_URL = "ここにウェブアプリURLを貼り付け";

    let selectedOrder = 'normal';
    let currentQuestions = [];
    let currentIndex = 0;
    let normalScore = 0;
    let totalMistakes = 0;
    let groupResults = {};
    let currentSetId = "1";

    // 画面初期化時に保存データチェック
    window.onload = function() {
        const savedData = localStorage.getItem('driver_quiz_saved');
        if (savedData) {
            document.getElementById('resume-box').style.display = 'block';
        }
    };

    function selectOrder(mode, elem) {
        selectedOrder = mode;
        document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('selected'));
        elem.classList.add('selected');
    }

    function startNewQuiz() {
        localStorage.removeItem('driver_quiz_saved');
        currentSetId = document.getElementById('set-select').value;
        loadAndStartQuiz(false);
    }

    function resumeQuiz() {
        const savedData = JSON.parse(localStorage.getItem('driver_quiz_saved'));
        if (savedData) {
            currentSetId = savedData.setId;
            selectedOrder = savedData.order;
            currentIndex = savedData.currentIndex;
            normalScore = savedData.normalScore;
            totalMistakes = savedData.totalMistakes;
            groupResults = savedData.groupResults;
            currentQuestions = savedData.currentQuestions;

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            document.getElementById('q-total').innerText = currentQuestions.length;
            showQuestion();
        }
    }

    async function loadAndStartQuiz(isResume) {
        const targetSheetName = "set" + currentSetId;

        document.getElementById('question-text').innerText = "データを読み込んでいます...";
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        try {
            const response = await fetch(`${GAS_API_URL}?set=${targetSheetName}`);
            const rawData = await response.json();

            if (!rawData || rawData.length === 0 || rawData.error) {
                alert("データの取得に失敗しました。");
                location.reload();
                return;
            }

            currentQuestions = rawData;

            if (selectedOrder === 'random') {
                currentQuestions.sort(() => Math.random() - 0.5);
            }

            currentIndex = 0;
            normalScore = 0;
            totalMistakes = 0;
            groupResults = {};

            document.getElementById('q-total').innerText = currentQuestions.length;
            showQuestion();

        } catch (error) {
            alert("通信エラーが発生しました。");
            console.error(error);
        }
    }

    function saveProgress() {
        const saveData = {
            setId: currentSetId,
            order: selectedOrder,
            currentIndex: currentIndex,
            normalScore: normalScore,
            totalMistakes: totalMistakes,
            groupResults: groupResults,
            currentQuestions: currentQuestions
        };
        localStorage.setItem('driver_quiz_saved', JSON.stringify(saveData));
    }

    function quitQuiz() {
        if (confirm("進捗を保存してトップ画面に戻りますか？")) {
            saveProgress();
            location.reload();
        }
    }

    function calculateTotalScore() {
        let score = normalScore;
        for (let group in groupResults) {
            const results = groupResults[group];
            if (results.length === 3 && results.every(res => res === true)) {
                score += 2;
            }
        }
        return score;
    }

    function showQuestion() {
        saveProgress(); // 1問ごとに進捗保存

        document.getElementById('result-box').style.display = 'none';
        document.getElementById('answer-buttons').style.display = 'flex';

        const q = currentQuestions[currentIndex];
        document.getElementById('q-idx').innerText = currentIndex + 1;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('current-score').innerText = calculateTotalScore();
        document.getElementById('mistake-count').innerText = totalMistakes;

        const imgBox = document.getElementById('img-box');
        const qImg = document.getElementById('q-img');

        if (q.img && q.img !== "") {
            qImg.src = q.img;
            imgBox.style.display = 'block';
        } else {
            imgBox.style.display = 'none';
        }
    }

    function checkAnswer(userAns) {
        document.getElementById('answer-buttons').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';

        const q = currentQuestions[currentIndex];
        const isCorrect = (userAns === q.a);

        if (!isCorrect) {
            totalMistakes += 1;
        }

        if (q.group && q.group !== "") {
            if (!groupResults[q.group]) groupResults[q.group] = [];
            groupResults[q.group].push(isCorrect);
        } else {
            if (isCorrect) normalScore += 1;
        }

        // ◯✕記号を廃止し、文字のみの直感的な表示へ
        const judgElem = document.getElementById('judgment');
        if (isCorrect) {
            judgElem.innerText = "正 解 ！";
            judgElem.className = "correct-judg";
        } else {
            judgElem.innerText = "不 正 解 …";
            judgElem.className = "incorrect-judg";
        }

        document.getElementById('correct-ans').innerText = q.a;
        document.getElementById('explanation').innerText = q.ex || "（解説なし）";
        document.getElementById('current-score').innerText = calculateTotalScore();
        document.getElementById('mistake-count').innerText = totalMistakes;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            // 全問終了したら保存データを削除
            localStorage.removeItem('driver_quiz_saved');

            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');

            const finalScore = calculateTotalScore();
            document.getElementById('final-score').innerText = finalScore + " 点";
            document.getElementById('final-mistakes').innerText = totalMistakes;

            const passElem = document.getElementById('pass-fail-text');
            if (finalScore >= 90) {
                passElem.innerText = "🎉 合格！（90点以上）";
                passElem.style.color = "var(--success-color)";
            } else {
                passElem.innerText = "❌ 不合格（合格ラインは90点）";
                passElem.style.color = "var(--danger-color)";
            }
        }
    }
</script>

</body>
</html>
