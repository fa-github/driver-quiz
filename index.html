<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本免学科試験クイズアプリ</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary-color: #007aff;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --warning-color: #ff9500;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        #app {
            background-color: var(--card-bg);
            width: 92%; max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 16px 20px 20px 20px; box-sizing: border-box;
            display: flex; flex-direction: column;
            min-height: 88vh;
        }

        .screen { display: none; flex-direction: column; height: 100%; flex-grow: 1; }
        .active { display: flex; }

        /* ヘッダー周り */
        .title-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;
        }
        h1 { font-size: 1.35em; text-align: center; color: var(--text-main); margin: 0; flex-grow: 1; }
        .btn-reload {
            background: none; border: none; font-size: 1.1em; cursor: pointer; padding: 2px 6px;
            border-radius: 8px; background-color: #f2f2f7;
        }

        h2 { font-size: 0.85em; color: var(--text-sub); text-align: center; margin-bottom: 12px; }

        .section-label { font-size: 0.88em; font-weight: bold; color: var(--text-main); margin: 10px 0 6px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-link { background: none; border: none; color: var(--primary-color); font-size: 0.82em; font-weight: bold; cursor: pointer; padding: 0; }

        /* セット選択カード */
        .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
        .set-card {
            background-color: #f9f9f9;
            border: 2px solid #e5e5ea;
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 52px;
            transition: all 0.2s;
        }
        .set-card.selected { border-color: var(--primary-color); background-color: #e5f1ff; }
        .set-title { font-size: 0.9em; font-weight: bold; color: var(--text-main); }
        .set-status { font-size: 0.72em; color: var(--text-sub); margin-top: 3px; font-weight: 500; }
        .history-dots { color: var(--primary-color); font-weight: bold; }

        /* 複数範囲テストの履歴領域 */
        .multi-history-box {
            background: #f2f2f7; border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; font-size: 0.78em; color: var(--text-main);
        }

        .mode-group { display: flex; gap: 6px; margin-bottom: 8px; }
        .mode-btn {
            flex: 1; padding: 8px 4px; text-align: center;
            border: 1px solid #d1d1d6; border-radius: 10px;
            cursor: pointer; font-weight: bold; background-color: #f9f9f9;
            font-size: 0.8em; color: var(--text-main);
        }
        .mode-btn.selected { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .radio-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .radio-btn {
            flex: 1; padding: 8px; text-align: center;
            border: 1px solid #d1d1d6; border-radius: 10px;
            cursor: pointer; font-weight: bold; background-color: #f9f9f9;
            font-size: 0.82em;
        }
        .radio-btn.selected { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .btn-primary, .btn-secondary, .btn-warning {
            background-color: var(--primary-color); color: white; border: none;
            padding: 13px; font-size: 1.0em; font-weight: bold;
            border-radius: 14px; cursor: pointer; width: 100%; margin-top: 4px;
        }
        .btn-secondary { background-color: #8e8e93; }
        .btn-warning { background-color: var(--warning-color); }

        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .btn-quit { background: none; border: none; color: var(--danger-color); font-size: 0.85em; font-weight: bold; cursor: pointer; padding: 0; }
        .btn-bookmark, .btn-jump {
            background: #f2f2f7; border: 1px solid #d1d1d6; border-radius: 20px;
            padding: 4px 10px; font-size: 0.8em; font-weight: bold; cursor: pointer; color: var(--text-main);
        }
        .btn-bookmark.active { background: #fff9e6; border-color: var(--warning-color); color: var(--warning-color); }

        .score-badge { background-color: #e5f1ff; color: var(--primary-color); padding: 3px 8px; border-radius: 10px; font-weight: bold; font-size: 0.82em; }

        .quiz-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e5e5ea; padding-bottom: 4px; margin-bottom: 12px;
            font-size: 0.82em; color: var(--text-sub);
        }

        /* 画像コンテナ */
        .img-container {
            width: 100%; text-align: center; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 6px; align-items: center;
        }
        .img-container img { max-width: 100%; max-height: 150px; border-radius: 10px; border: 1px solid #e5e5ea; }

        #single-q-box { display: none; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        #question-text {
            font-size: 1.05em; line-height: 1.5; color: var(--text-main);
            margin-bottom: 28px;
            font-weight: 500;
        }
        
        .btn-ans-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .btn-ans { flex: 1; padding: 14px 0; font-size: 2.0em; border: none; border-radius: 14px; cursor: pointer; color: white; font-weight: bold; }
        #btn-true { background-color: var(--success-color); }
        #btn-false { background-color: var(--danger-color); }

        .group-sub-q { background: #f9f9f9; padding: 8px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #e5e5ea; }
        .group-sub-text { font-size: 0.88em; line-height: 1.35; font-weight: bold; margin-bottom: 4px; color: var(--text-main); }
        .group-toggle-group { display: flex; gap: 8px; }
        .toggle-opt {
            flex: 1; padding: 6px 0; text-align: center; border: 1px solid #d1d1d6; border-radius: 8px;
            font-weight: bold; font-size: 1.0em; cursor: pointer; background: white; color: var(--text-sub);
        }
        .toggle-opt.selected-true { background-color: var(--success-color); color: white; border-color: var(--success-color); }
        .toggle-opt.selected-false { background-color: var(--danger-color); color: white; border-color: var(--danger-color); }

        #result-box { display: none; text-align: center; border-top: 1px solid #e5e5ea; padding-top: 8px; margin-top: 4px; }
        #judgment { font-size: 1.5em; font-weight: bold; margin-bottom: 4px; }
        .correct-judg { color: var(--success-color); }
        .incorrect-judg { color: var(--danger-color); }
        .explanation-box {
            font-size: 0.85em; line-height: 1.35; color: var(--text-main);
            background-color: #f2f2f7; padding: 8px 10px; border-radius: 10px;
            margin: 6px 0 10px 0; text-align: left;
        }

        .nav-btn-group { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
        .nav-btn-group button { flex: 1; margin-top: 0; padding: 12px; font-size: 0.9em; }

        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:99; }
        .modal-content { background:white; padding:16px; border-radius:16px; width:88%; max-width:400px; text-align:center; box-sizing: border-box; }

        .jump-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 48vh;
            overflow-y: auto;
            padding: 6px;
            margin-top: 8px;
        }
        .jump-btn {
            background-color: #f2f2f7;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            padding: 6px 2px;
            font-size: 0.76em;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative;
            min-height: 42px;
            box-sizing: border-box;
        }
        .jump-btn.state-correct { background-color: #e8f8ed; border-color: var(--success-color); color: #1e7e34; }
        .jump-btn.state-incorrect { background-color: #ffebe9; border-color: var(--danger-color); color: #c5221f; }
        .jump-btn.state-bm { border: 2px solid var(--warning-color) !important; }
        .jump-btn.current { outline: 2px solid var(--primary-color); outline-offset: -1px; font-weight: bold; }
        .jump-subtext { font-size: 0.82em; opacity: 0.85; margin-top: 1px; }
        .jump-legend {
            display: flex; justify-content: space-around; font-size: 0.7em; color: var(--text-sub);
            margin-top: 4px; padding: 4px; background: #f9f9f9; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="setup-screen" class="screen active">
        <div class="title-bar">
            <div style="width: 28px;"></div>
            <h1>本免学科試験クイズ</h1>
            <button class="btn-reload" onclick="forceReloadApp()" title="アプリを最新状態に更新">🔄</button>
        </div>
        <h2>条件を選んでスタート</h2>

        <div class="section-label">
            <span>1. 出題範囲（複数選択可能）</span>
            <button class="btn-link" onclick="toggleSelectAllSets()">全選択 / 解除</button>
        </div>
        <div class="set-grid" id="set-card-grid"></div>

        <div id="multi-history-area" class="multi-history-box" style="display:none;"></div>

        <div class="section-label">2. 出題モード</div>
        <div class="mode-group">
            <div class="mode-btn selected" id="mode-all" onclick="selectMode('all')">模擬試験（95問/100点）</div>
            <div class="mode-btn" id="mode-weak" onclick="selectMode('weak')">弱点 (正答80%未満)</div>
            <div class="mode-btn" id="mode-bm" onclick="selectMode('bm')">★ ブックマーク</div>
        </div>

        <div class="section-label">3. 出題順</div>
        <div class="radio-group">
            <div class="radio-btn selected" onclick="selectOrder('normal', this)">順番通り</div>
            <div class="radio-btn" onclick="selectOrder('random', this)">ランダム</div>
        </div>

        <button class="btn-primary" onclick="startQuizFromSetup()">学習を開始する</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="top-nav">
            <button class="btn-quit" onclick="quitQuiz()">✕ 中断</button>
            <button class="btn-jump" onclick="openJumpModal()">🔢 問題移動</button>
            <button id="bm-toggle-btn" class="btn-bookmark" onclick="toggleCurrentBookmark()">★ ブックマーク</button>
            <div class="score-badge">獲得点: <span id="current-score">0</span> / 100 点</div>
        </div>

        <div class="quiz-header">
            <div>進行: <span id="q-idx">1</span> / <span id="q-total">95</span></div>
            <div>ミス: <span id="mistake-count" style="color:var(--danger-color); font-weight:bold;">0</span> 問</div>
        </div>

        <!-- 複数画像表示対応コンテナ -->
        <div id="img-box" class="img-container" style="display:none;"></div>

        <div id="single-q-box">
            <div id="question-text">読み込み中...</div>
            <div id="answer-buttons" class="btn-ans-group">
                <button id="btn-true" class="btn-ans" onclick="checkSingleAnswer('◯')">◯</button>
                <button id="btn-false" class="btn-ans" onclick="checkSingleAnswer('✕')">✕</button>
            </div>
        </div>

        <div id="group-q-box" style="display:none; flex-direction:column; flex-grow:1;">
            <div style="font-weight:bold; font-size:0.88em; color:var(--primary-color); margin-bottom:6px;">
                【イラスト問題】3つの記述すべての◯✕を選択してください（全正解で2点）
            </div>
            <div id="group-sub-list"></div>
            <button id="btn-confirm-group" class="btn-primary" onclick="checkGroupAnswer()" disabled style="opacity:0.5;">回答を確定する</button>
        </div>

        <div id="result-box">
            <div id="judgment"></div>
            <div id="explanation-container" class="explanation-box"></div>
        </div>

        <!-- 常時表示の前後移動ボタン -->
        <div class="nav-btn-group">
            <button id="prev-btn" class="btn-secondary" onclick="prevQuestion()">◀ 前の問へ</button>
            <button id="next-btn" class="btn-primary" onclick="nextQuestion()">次の問題へ ▶</button>
        </div>
    </div>

    <div id="result-screen" class="screen" style="text-align: center; justify-content: center;">
        <h1 id="final-status">結果発表</h1>
        <div style="font-size: 2.8em; font-weight: bold; margin: 10px 0 2px 0;" id="final-score">0 点</div>
        <p style="color:var(--text-sub); margin-bottom:15px; font-size:0.85em;">（100点満点中）</p>

        <div style="background:#f2f2f7; padding:12px; border-radius:12px; margin-bottom:15px; text-align:left; line-height:1.7; font-size:0.9em;">
            <div>・間違えた問題数: <strong id="final-mistakes" style="color:var(--danger-color);">0</strong> 問</div>
            <div>・判定: <strong id="pass-fail-text"></strong></div>
        </div>

        <button id="btn-retry-mistakes" class="btn-warning" style="display:none; margin-bottom:8px;" onclick="retryMistakesOnly()">今回間違えた問題（<span id="retry-count">0</span>問）だけ解き直す</button>
        <button class="btn-primary" onclick="backToTop()">セット一覧に戻る</button>
    </div>
</div>

<div id="resume-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">中断データがあります</h3>
        <p style="font-size:0.85em; color:var(--text-sub);" id="modal-desc">前回の続きから再開しますか？</p>
        <button class="btn-primary" onclick="confirmResume(true)">前回の続きから再開</button>
        <button class="btn-secondary" onclick="confirmResume(false)">最初から解き直す</button>
    </div>
</div>

<!-- 問題ジャンプ用モーダル -->
<div id="jump-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; margin-bottom:2px;">問題番号を選択</h3>
        <div class="jump-legend">
            <span>🟢 正解</span>
            <span>🔴 不正解</span>
            <span>🟡 太枠: ★復習</span>
            <span>⚪ 未解答</span>
        </div>
        <div id="jump-grid" class="jump-grid"></div>
        <button class="btn-secondary" style="margin-top:10px; padding:10px;" onclick="closeJumpModal()">閉じる</button>
    </div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxaax0xEuJx68UF4tVIL21mwuXSx-S9h5qXiHxNwKAwxxTsm5w30ZwAe3qf44VqRHCR/exec";

    let selectedSetIds = ["1"];
    let selectedMode = 'all';
    let selectedOrder = 'normal';

    let groupedQuestions = [];
    let currentIndex = 0;
    let normalScore = 0;
    let totalMistakes = 0;
    let groupUserAnswers = {};
    let sessionMistakeSteps = [];
    let stepResultsMap = {};

    const SETS_CONFIG = [
        { id: "1", name: "第 1 集" },
        { id: "2", name: "第 2 集" },
        { id: "3", name: "第 3 集" },
        { id: "4", name: "第 4 集" },
        { id: "5", name: "第 5 集" },
        { id: "6", name: "第 6 集" },
        { id: "7", name: "第 7 集" }
    ];

    window.onload = function() {
        renderSetCards();
    };

    /* 強制キャッシュクリア＆リロード */
    function forceReloadApp() {
        if (confirm("アプリのキャッシュをクリアして最新状態に更新しますか？")) {
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            window.location.reload(true);
        }
    }

    function renderSetCards() {
        const gridElem = document.getElementById('set-card-grid');
        gridElem.innerHTML = "";

        const historyMap = JSON.parse(localStorage.getItem('driver_quiz_history_map') || '{}');

        SETS_CONFIG.forEach(set => {
            const card = document.createElement('div');
            const isSelected = selectedSetIds.includes(set.id);
            card.className = "set-card" + (isSelected ? " selected" : "");

            const history = historyMap[set.id] || [];
            let historyText = "未挑戦";

            if (history.length > 0) {
                const last5 = history.slice(-5);
                historyText = `直近: <span class="history-dots">${last5.join(' ➔ ')}点</span>`;
            }

            card.innerHTML = `
                <div class="set-title">${set.name}</div>
                <div class="set-status">${historyText}</div>
            `;

            card.onclick = () => toggleSetSelection(set.id);
            gridElem.appendChild(card);
        });

        renderMultiHistory();
    }

    function renderMultiHistory() {
        const multiBox = document.getElementById('multi-history-area');
        if (selectedSetIds.length <= 1) {
            multiBox.style.display = 'none';
            return;
        }

        const multiHistory = JSON.parse(localStorage.getItem('driver_quiz_multi_history') || '[]');
        
        if (multiHistory.length === 0) {
            multiBox.innerHTML = `<strong>【複数選択履歴】</strong> 未挑戦`;
        } else {
            const last3 = multiHistory.slice(-3).reverse();
            let itemsText = last3.map(item => `${item.sets.join(',')} ➔ ${item.score}点`).join(' | ');
            multiBox.innerHTML = `<strong>【複数選択履歴】</strong> ${itemsText}`;
        }
        multiBox.style.display = 'block';
    }

    function toggleSetSelection(setId) {
        if (selectedSetIds.includes(setId)) {
            if (selectedSetIds.length > 1) {
                selectedSetIds = selectedSetIds.filter(id => id !== setId);
            }
        } else {
            selectedSetIds.push(setId);
        }
        renderSetCards();
    }

    function toggleSelectAllSets() {
        if (selectedSetIds.length === SETS_CONFIG.length) {
            selectedSetIds = ["1"];
        } else {
            selectedSetIds = SETS_CONFIG.map(s => s.id);
        }
        renderSetCards();
    }

    function selectMode(mode) {
        selectedMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
        document.getElementById(`mode-${mode}`).classList.add('selected');
    }

    function selectOrder(mode, elem) {
        selectedOrder = mode;
        document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('selected'));
        elem.classList.add('selected');
    }

    function startQuizFromSetup() {
        const activeSave = JSON.parse(localStorage.getItem('driver_quiz_active_save') || 'null');
        if (activeSave) {
            document.getElementById('modal-desc').innerText = `保存された進行データ（${activeSave.currentIndex + 1}問目）があります。`;
            document.getElementById('resume-modal').style.display = 'flex';
        } else {
            fetchAndStartQuiz(false);
        }
    }

    function confirmResume(shouldResume) {
        document.getElementById('resume-modal').style.display = 'none';
        if (shouldResume) {
            fetchAndStartQuiz(true);
        } else {
            localStorage.removeItem('driver_quiz_active_save');
            fetchAndStartQuiz(false);
        }
    }

    async function fetchAndStartQuiz(isResume) {
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        if (isResume) {
            const activeSave = JSON.parse(localStorage.getItem('driver_quiz_active_save'));
            groupedQuestions = activeSave.groupedQuestions;
            currentIndex = activeSave.currentIndex;
            normalScore = activeSave.normalScore;
            totalMistakes = activeSave.totalMistakes;
            sessionMistakeSteps = activeSave.sessionMistakeSteps || [];
            stepResultsMap = activeSave.stepResultsMap || {};

            document.getElementById('q-total').innerText = groupedQuestions.length;
            showQuestion();
            return;
        }

        document.getElementById('single-q-box').style.display = 'none';
        document.getElementById('group-q-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('img-box').style.display = 'none';
        document.getElementById('question-text').innerText = "データを読み込んでいます...";

        try {
            const fetchPromises = selectedSetIds.map(id => 
                fetch(`${GAS_API_URL}?set=set${id}`).then(r => r.json()).catch(() => [])
            );
            const results = await Promise.all(fetchPromises);

            let combinedRaw = [];
            results.forEach((rawData, idx) => {
                const setId = selectedSetIds[idx];
                if (Array.isArray(rawData)) {
                    rawData.forEach(item => {
                        item._setId = setId;
                        item._uniqueKey = `${setId}-${item.num}`;
                        combinedRaw.push(item);
                    });
                }
            });

            if (combinedRaw.length === 0) {
                alert("指定した範囲のデータが取得できませんでした。");
                backToTop();
                return;
            }

            const { singles, groups } = processRawQuestionsToPools(combinedRaw);

            if (selectedMode === 'all') {
                if (selectedOrder === 'normal') {
                    singles.sort((a,b) => parseInt(a.num) - parseInt(b.num));
                    groups.sort((a,b) => parseInt(a.group) - parseInt(b.group));

                    const pickedSingles = singles.slice(0, 90);
                    const pickedGroups = groups.slice(0, 5);
                    groupedQuestions = [...pickedSingles, ...pickedGroups];
                } else {
                    singles.sort(() => Math.random() - 0.5);
                    groups.sort(() => Math.random() - 0.5);

                    const pickedSingles = singles.slice(0, 90);
                    const pickedGroups = groups.slice(0, 5);
                    groupedQuestions = [...pickedSingles, ...pickedGroups].sort(() => Math.random() - 0.5);
                }
            } else {
                let pool = [...singles, ...groups];
                const statsMap = JSON.parse(localStorage.getItem('driver_quiz_stats_map') || '{}');
                const bookmarkSet = new Set(JSON.parse(localStorage.getItem('driver_quiz_bookmarks') || '[]'));

                if (selectedMode === 'weak') {
                    pool = pool.filter(step => {
                        const checkWeak = (key) => {
                            const stat = statsMap[key];
                            if (!stat || stat.total < 1) return false;
                            return (stat.correct / stat.total) < 0.8;
                        };

                        if (step.type === 'single') return checkWeak(step.uniqueKey);
                        return step.items.some(item => checkWeak(item._uniqueKey));
                    });
                    if (pool.length === 0) {
                        alert("選択した範囲内に「正答率80%未満」の弱点問題はありませんでした！");
                        backToTop();
                        return;
                    }
                } else if (selectedMode === 'bm') {
                    pool = pool.filter(step => {
                        if (step.type === 'single') return bookmarkSet.has(step.uniqueKey);
                        return step.items.some(item => bookmarkSet.has(item._uniqueKey));
                    });
                    if (pool.length === 0) {
                        alert("選択した範囲内に「★ ブックマーク」された問題はありませんでした！");
                        backToTop();
                        return;
                    }
                }

                if (selectedOrder === 'random') {
                    pool.sort(() => Math.random() - 0.5);
                } else {
                    pool.sort((a, b) => {
                        const numA = a.type === 'single' ? parseInt(a.num) : (parseInt(a.group) + 100);
                        const numB = b.type === 'single' ? parseInt(b.num) : (parseInt(b.group) + 100);
                        return numA - numB;
                    });
                }
                groupedQuestions = pool;
            }

            currentIndex = 0;
            normalScore = 0;
            totalMistakes = 0;
            sessionMistakeSteps = [];
            stepResultsMap = {};

            document.getElementById('q-total').innerText = groupedQuestions.length;
            showQuestion();

        } catch (error) {
            alert("通信エラーが発生しました。");
            console.error(error);
            backToTop();
        }
    }

    function processRawQuestionsToPools(rawData) {
        const singles = [];
        const groupsMap = {};
        let i = 0;

        while (i < rawData.length) {
            const item = rawData[i];
            const grp = (item.group || "").toString().trim();

            if (!grp) {
                singles.push({
                    type: "single",
                    setId: item._setId,
                    uniqueKey: item._uniqueKey,
                    num: item.num,
                    q: item.q,
                    a: item.a,
                    ex: item.ex,
                    img: item.img || ""
                });
                i++;
            } else {
                const groupItems = [];
                const groupId = grp;
                const currentSetId = item._setId;

                while (i < rawData.length && 
                       (rawData[i].group || "").toString().trim() === groupId && 
                       rawData[i]._setId === currentSetId) {
                    groupItems.push(rawData[i]);
                    i++;
                }

                const groupKey = `${currentSetId}-${groupId}`;
                groupsMap[groupKey] = {
                    type: "group",
                    setId: currentSetId,
                    group: groupId,
                    img: item.img || "",
                    items: groupItems
                };
            }
        }
        return { singles, groups: Object.values(groupsMap) };
    }

    function saveActiveProgress() {
        const activeSave = {
            selectedSetIds: selectedSetIds,
            selectedMode: selectedMode,
            selectedOrder: selectedOrder,
            currentIndex: currentIndex,
            normalScore: normalScore,
            totalMistakes: totalMistakes,
            groupedQuestions: groupedQuestions,
            sessionMistakeSteps: sessionMistakeSteps,
            stepResultsMap: stepResultsMap
        };
        localStorage.setItem('driver_quiz_active_save', JSON.stringify(activeSave));
    }

    function showQuestion() {
        saveActiveProgress();

        document.getElementById('current-score').innerText = normalScore;
        document.getElementById('mistake-count').innerText = totalMistakes;
        document.getElementById('q-idx').innerText = currentIndex + 1;

        const currentStep = groupedQuestions[currentIndex];
        const prevResult = stepResultsMap[currentIndex];

        updateBookmarkUI();

        /* --- 複数画像表示のレンダリング処理 --- */
        const imgBox = document.getElementById('img-box');
        imgBox.innerHTML = "";

        const rawImgStr = (currentStep.img || "").toString().trim();

        if (rawImgStr !== "") {
            const imgUrls = rawImgStr.split(/[\r\n,]+/).map(s => s.trim()).filter(s => s !== "");

            if (imgUrls.length > 0) {
                imgUrls.forEach(url => {
                    const imgElem = document.createElement('img');
                    imgElem.src = url;
                    imgElem.alt = "問題画像";
                    imgElem.referrerPolicy = "no-referrer";
                    imgBox.appendChild(imgElem);
                });
                imgBox.style.display = 'flex';
            } else {
                imgBox.style.display = 'none';
            }
        } else {
            imgBox.style.display = 'none';
        }

        if (currentStep.type === "single") {
            document.getElementById('single-q-box').style.display = 'flex';
            document.getElementById('group-q-box').style.display = 'none';
            document.getElementById('question-text').innerText = currentStep.q;

            if (prevResult) {
                document.getElementById('answer-buttons').style.display = 'none';
                showResultUI(prevResult.isCorrect, prevResult.explanationHTML);
            } else {
                document.getElementById('answer-buttons').style.display = 'flex';
                document.getElementById('result-box').style.display = 'none';
            }
        } else {
            document.getElementById('single-q-box').style.display = 'none';
            document.getElementById('group-q-box').style.display = 'flex';
            renderGroupQuestions(currentStep, prevResult);
        }

        // 前に戻るボタンの活性化チェック
        const prevBtn = document.getElementById('prev-btn');
        if (prevBtn) {
            prevBtn.disabled = (currentIndex === 0);
            prevBtn.style.opacity = (currentIndex === 0) ? "0.4" : "1";
        }
    }

    function updateBookmarkUI() {
        const currentStep = groupedQuestions[currentIndex];
        const bookmarkSet = new Set(JSON.parse(localStorage.getItem('driver_quiz_bookmarks') || '[]'));
        const bmBtn = document.getElementById('bm-toggle-btn');

        let isBm = false;
        if (currentStep.type === 'single') {
            isBm = bookmarkSet.has(currentStep.uniqueKey);
        } else {
            isBm = currentStep.items.some(item => bookmarkSet.has(item._uniqueKey));
        }

        if (isBm) {
            bmBtn.className = "btn-bookmark active";
            bmBtn.innerText = "★ ブックマーク";
        } else {
            bmBtn.className = "btn-bookmark";
            bmBtn.innerText = "☆ ブックマーク追加";
        }
    }

    function toggleCurrentBookmark() {
        const currentStep = groupedQuestions[currentIndex];
        let bookmarkList = JSON.parse(localStorage.getItem('driver_quiz_bookmarks') || '[]');
        let bookmarkSet = new Set(bookmarkList);

        const keysToToggle = currentStep.type === 'single' ? 
            [currentStep.uniqueKey] : currentStep.items.map(item => item._uniqueKey);

        const isCurrentlyBm = keysToToggle.some(key => bookmarkSet.has(key));

        keysToToggle.forEach(key => {
            if (isCurrentlyBm) {
                bookmarkSet.delete(key);
            } else {
                bookmarkSet.add(key);
            }
        });

        localStorage.setItem('driver_quiz_bookmarks', JSON.stringify(Array.from(bookmarkSet)));
        updateBookmarkUI();
    }

    function renderGroupQuestions(stepData, prevResult) {
        groupUserAnswers = (prevResult && prevResult.userAnswers) || {};
        const container = document.getElementById('group-sub-list');
        container.innerHTML = "";

        stepData.items.forEach((item, idx) => {
            const subBox = document.createElement('div');
            subBox.className = "group-sub-q";

            const userVal = groupUserAnswers[idx];

            subBox.innerHTML = `
                <div class="group-sub-text">${item.q}</div>
                <div class="group-toggle-group">
                    <div class="toggle-opt ${userVal === '◯' ? 'selected-true' : ''}" id="toggle-${idx}-true" ${!prevResult ? `onclick="selectGroupOpt(${idx}, '◯')"` : ''}>◯</div>
                    <div class="toggle-opt ${userVal === '✕' ? 'selected-false' : ''}" id="toggle-${idx}-false" ${!prevResult ? `onclick="selectGroupOpt(${idx}, '✕')"` : ''}>✕</div>
                </div>
            `;
            container.appendChild(subBox);
        });

        const confirmBtn = document.getElementById('btn-confirm-group');
        if (prevResult) {
            confirmBtn.style.display = 'none';
            showResultUI(prevResult.isCorrect, prevResult.explanationHTML);
        } else {
            confirmBtn.style.display = 'block';
            document.getElementById('result-box').style.display = 'none';
            updateGroupConfirmBtn();
        }
    }

    function selectGroupOpt(subIdx, val) {
        if (stepResultsMap[currentIndex]) return;

        groupUserAnswers[subIdx] = val;

        const trueBtn = document.getElementById(`toggle-${subIdx}-true`);
        const falseBtn = document.getElementById(`toggle-${subIdx}-false`);

        trueBtn.className = "toggle-opt" + (val === '◯' ? " selected-true" : "");
        falseBtn.className = "toggle-opt" + (val === '✕' ? " selected-false" : "");

        updateGroupConfirmBtn();
    }

    function updateGroupConfirmBtn() {
        const currentStep = groupedQuestions[currentIndex];
        const btn = document.getElementById('btn-confirm-group');

        const answeredCount = Object.keys(groupUserAnswers).length;
        if (answeredCount === currentStep.items.length) {
            btn.disabled = false;
            btn.style.opacity = "1";
        } else {
            btn.disabled = true;
            btn.style.opacity = "0.5";
        }
    }

    function recordQuestionStat(uniqueKey, isCorrect) {
        const statsMap = JSON.parse(localStorage.getItem('driver_quiz_stats_map') || '{}');
        if (!statsMap[uniqueKey]) {
            statsMap[uniqueKey] = { total: 0, correct: 0 };
        }
        statsMap[uniqueKey].total += 1;
        if (isCorrect) statsMap[uniqueKey].correct += 1;
        localStorage.setItem('driver_quiz_stats_map', JSON.stringify(statsMap));
    }

    function checkSingleAnswer(userAns) {
        if (stepResultsMap[currentIndex]) return;

        document.getElementById('answer-buttons').style.display = 'none';

        const step = groupedQuestions[currentIndex];
        const isCorrect = (userAns === step.a);

        recordQuestionStat(step.uniqueKey, isCorrect);

        const explanationHTML = `<strong>正解: ${step.a}</strong><br>${step.ex || '（解説なし）'}`;

        stepResultsMap[currentIndex] = {
            isCorrect: isCorrect,
            explanationHTML: explanationHTML,
            userAnswers: { 0: userAns }
        };

        if (isCorrect) {
            normalScore += 1;
        } else {
            totalMistakes += 1;
            sessionMistakeSteps.push(step);
        }

        showResultUI(isCorrect, explanationHTML);
    }

    function checkGroupAnswer() {
        if (stepResultsMap[currentIndex]) return;

        document.getElementById('btn-confirm-group').style.display = 'none';

        const step = groupedQuestions[currentIndex];
        let allCorrect = true;
        let explanationHTML = "";

        step.items.forEach((item, idx) => {
            const userAns = groupUserAnswers[idx];
            const isSubCorrect = (userAns === item.a);

            recordQuestionStat(item._uniqueKey, isSubCorrect);

            if (!isSubCorrect) {
                allCorrect = false;
                totalMistakes += 1;
            }

            explanationHTML += `
                <div style="margin-bottom:6px; border-bottom:1px solid #e5e5ea; padding-bottom:4px;">
                    <strong>小問${idx+1}: 正解 [ ${item.a} ]</strong>（あなたの回答: ${userAns} ${isSubCorrect ? '正解' : '不正解'}）<br>
                    ${item.ex || '（解説なし）'}
                </div>
            `;
        });

        stepResultsMap[currentIndex] = {
            isCorrect: allCorrect,
            explanationHTML: explanationHTML,
            userAnswers: { ...groupUserAnswers }
        };

        if (allCorrect) {
            normalScore += 2;
        } else {
            sessionMistakeSteps.push(step);
        }

        showResultUI(allCorrect, explanationHTML);
    }

    function showResultUI(isCorrect, explanationHTML) {
        document.getElementById('result-box').style.display = 'block';

        const judgElem = document.getElementById('judgment');
        if (isCorrect) {
            judgElem.innerText = "正 解 ！";
            judgElem.className = "correct-judg";
        } else {
            judgElem.innerText = "不 正 解 …";
            judgElem.className = "incorrect-judg";
        }

        document.getElementById('explanation-container').innerHTML = explanationHTML;
        document.getElementById('current-score').innerText = normalScore;
        document.getElementById('mistake-count').innerText = totalMistakes;
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            showQuestion();
        }
    }

    function nextQuestion() {
        document.getElementById('btn-confirm-group').style.display = 'block';

        const totalAnsweredCount = Object.keys(stepResultsMap).length;
        if (totalAnsweredCount >= groupedQuestions.length) {
            finishQuiz();
            return;
        }

        let nextIdx = -1;
        for (let i = currentIndex + 1; i < groupedQuestions.length; i++) {
            if (!stepResultsMap[i]) {
                nextIdx = i;
                break;
            }
        }
        if (nextIdx === -1) {
            for (let i = 0; i < currentIndex; i++) {
                if (!stepResultsMap[i]) {
                    nextIdx = i;
                    break;
                }
            }
        }

        if (nextIdx !== -1) {
            currentIndex = nextIdx;
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    /* --- ジャンプ機能用ロジック --- */
    function openJumpModal() {
        const grid = document.getElementById('jump-grid');
        grid.innerHTML = "";

        const bookmarkSet = new Set(JSON.parse(localStorage.getItem('driver_quiz_bookmarks') || '[]'));

        groupedQuestions.forEach((step, idx) => {
            const btn = document.createElement('div');
            const resultData = stepResultsMap[idx];
            const isCurrent = (idx === currentIndex);

            let isBm = false;
            if (step.type === 'single') {
                isBm = bookmarkSet.has(step.uniqueKey);
            } else {
                isBm = step.items.some(item => bookmarkSet.has(item._uniqueKey));
            }

            let stateClass = "";
            let iconMark = "";

            if (resultData) {
                if (resultData.isCorrect) {
                    stateClass += " state-correct";
                    iconMark = "✓";
                } else {
                    stateClass += " state-incorrect";
                    iconMark = "✕";
                }
            }

            if (isBm) {
                stateClass += " state-bm";
            }

            if (isCurrent) {
                stateClass += " current";
            }

            btn.className = "jump-btn" + stateClass;

            let labelText = "";
            if (step.type === 'single') {
                labelText = `第${step.setId}集-問${step.num}`;
            } else {
                labelText = `第${step.setId}集-問${step.group}`;
            }

            btn.innerHTML = `
                <div><strong>#${idx + 1}</strong> <span style="font-size:0.85em; font-weight:bold;">${iconMark}</span></div>
                <div class="jump-subtext">${labelText}</div>
            `;

            btn.onclick = () => {
                currentIndex = idx;
                closeJumpModal();
                showQuestion();
            };

            grid.appendChild(btn);
        });

        document.getElementById('jump-modal').style.display = 'flex';
    }

    function closeJumpModal() {
        document.getElementById('jump-modal').style.display = 'none';
    }

    function finishQuiz() {
        localStorage.removeItem('driver_quiz_active_save');

        if (selectedMode === 'all') {
            if (selectedSetIds.length === 1) {
                const setId = selectedSetIds[0];
                const historyMap = JSON.parse(localStorage.getItem('driver_quiz_history_map') || '{}');
                if (!historyMap[setId]) historyMap[setId] = [];
                historyMap[setId].push(normalScore);
                if (historyMap[setId].length > 10) historyMap[setId].shift();
                localStorage.setItem('driver_quiz_history_map', JSON.stringify(historyMap));
            } else {
                const multiHistory = JSON.parse(localStorage.getItem('driver_quiz_multi_history') || '[]');
                multiHistory.push({
                    sets: selectedSetIds,
                    score: normalScore
                });
                if (multiHistory.length > 10) multiHistory.shift();
                localStorage.setItem('driver_quiz_multi_history', JSON.stringify(multiHistory));
            }
        }

        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');

        document.getElementById('final-score').innerText = normalScore + " 点";
        document.getElementById('final-mistakes').innerText = totalMistakes;

        const passElem = document.getElementById('pass-fail-text');
        if (normalScore >= 90) {
            passElem.innerText = "🎉 合格！（90点以上）";
            passElem.style.color = "var(--success-color)";
        } else {
            passElem.innerText = "❌ 不合格（合格ラインは90点）";
            passElem.style.color = "var(--danger-color)";
        }

        const retryBtn = document.getElementById('btn-retry-mistakes');
        if (sessionMistakeSteps.length > 0) {
            retryBtn.style.display = 'block';
            document.getElementById('retry-count').innerText = sessionMistakeSteps.length;
        } else {
            retryBtn.style.display = 'none';
        }
    }

    function retryMistakesOnly() {
        groupedQuestions = JSON.parse(JSON.stringify(sessionMistakeSteps));
        currentIndex = 0;
        normalScore = 0;
        totalMistakes = 0;
        sessionMistakeSteps = [];
        stepResultsMap = {};

        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        document.getElementById('q-total').innerText = groupedQuestions.length;
        showQuestion();
    }

    function quitQuiz() {
        if (confirm("進捗を保存してセット一覧に戻りますか？")) {
            saveActiveProgress();
            backToTop();
        }
    }

    function backToTop() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('setup-screen').classList.add('active');
        renderSetCards();
    }
</script>
